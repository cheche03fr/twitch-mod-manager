name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Tag v1.2.3 : la version de l'app (pied de page, installeur, mises à jour) vient du tag
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: twitch-mod-manager-setup
          path: dist/*.exe

      # Tag v* : publie installeur + latest.yml dans le dépôt public (source des mises à jour auto)
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/Twitch-Mod-Manager-Setup-*.exe dist/*.blockmap dist/latest.yml
          --repo cheche03fr/twitch-mod-manager-releases
          --title "Twitch Mod Manager $GITHUB_REF_NAME"
          --notes "Installeur Windows. Les versions déjà installées se mettent à jour automatiquement."
