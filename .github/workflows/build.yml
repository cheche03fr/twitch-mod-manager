name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Lecture seule par défaut : seul le job « release » peut écrire dans le dépôt,
# pour qu'une dépendance npm piratée pendant la compilation ne puisse pas modifier les releases
permissions:
  contents: read

# Actions figées par empreinte de commit (un tag de version peut être déplacé) ; la version est en commentaire
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Tag v1.2.3 : la version de l'app (pied de page, installeur, mises à jour) vient du tag
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Signature avec le certificat cheche03fr (dépôt privé "certificat", secrets ajoutés par ajouter-au-projet.ps1)
      # Les secrets ne sont donnés qu'à cette étape
      - run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twitch-mod-manager-setup
          if-no-files-found: error
          path: |
            dist/Twitch-Mod-Manager-Setup-*.exe
            dist/*.blockmap
            dist/latest.yml

  # Tag v* : publie installeur + fichier de mise à jour dans les Releases de ce dépôt (source des mises à jour auto)
  # Tag v1.2.3-beta.1 : pré-version, ignorée par les apps sans « Recevoir les versions bêta »
  # (elles ne lisent que la dernière release normale)
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # créer la release ; ce job n'installe aucune dépendance npm
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: twitch-mod-manager-setup
          path: dist

      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra=(--prerelease --notes "Version bêta : proposée seulement si « Recevoir les versions bêta » est coché dans les Paramètres.")
          else
            extra=(--notes "Installeur Windows. Les versions déjà installées se mettent à jour automatiquement.")
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/Twitch-Mod-Manager-Setup-*.exe dist/*.blockmap dist/latest.yml \
            --title "Twitch Mod Manager $GITHUB_REF_NAME" "${extra[@]}"
