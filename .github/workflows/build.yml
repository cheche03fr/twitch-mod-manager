name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Push sur main : simple compilation de test, l'installeur est dans l'onglet Actions
      - if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run dist

      - if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: twitch-mod-manager-setup
          path: dist/*.exe

      # Tag v* : publie l'installeur + latest.yml dans le dépôt public des releases (mises à jour auto)
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
