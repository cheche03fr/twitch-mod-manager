name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # créer les releases dans ce dépôt

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Tag v1.2.3 : la version de l'app (pied de page, installeur, mises à jour) vient du tag
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Signature avec le certificat cheche03fr (dépôt privé "certificat", secrets ajoutés par ajouter-au-projet.ps1)
      - run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: twitch-mod-manager-setup
          path: dist/*.exe

      # Tag v* : publie installeur + fichier de mise à jour dans les Releases de ce dépôt (source des mises à jour auto)
      # Tag v1.2.3-beta.1 : pré-version, ignorée par les apps sans « Recevoir les versions bêta »
      # (elles ne lisent que la dernière release normale)
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra=(--prerelease --notes "Version bêta : proposée seulement si « Recevoir les versions bêta » est coché dans les Paramètres.")
          else
            extra=(--notes "Installeur Windows. Les versions déjà installées se mettent à jour automatiquement.")
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/Twitch-Mod-Manager-Setup-*.exe dist/*.blockmap dist/latest.yml \
            --title "Twitch Mod Manager $GITHUB_REF_NAME" "${extra[@]}"
